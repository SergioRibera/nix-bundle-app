name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build tests + lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache /nix/store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nixfmt --check
        run: |
          mapfile -t files < <(git ls-files '*.nix')
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          nix run nixpkgs#nixfmt-rfc-style -- --check "${files[@]}"

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail .

      - name: Build tests (every format against pkgs.hello + a Rust binary)
        run: nix-build tests -L --keep-going

  bundles-linux:
    name: Build + upload linux bundles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache /nix/store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build linux bundles
        run: nix-build examples -A hello-all-linux -L -o result-linux

      - name: Stage artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts/linux
          # linkFarm result-linux has one symlink per format
          for d in result-linux/*; do
            [ -e "$d" ] || continue
            cp -L -r --no-preserve=mode,ownership "$d"/. artifacts/linux/ 2>/dev/null || true
          done
          chmod -R u+w artifacts/linux
          ls -lR artifacts/linux

      - name: Upload linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          path: artifacts/linux/**
          if-no-files-found: error
          retention-days: 14

  bundles-windows:
    name: Build + upload windows bundles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache /nix/store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build windows bundles (cross-compiled from linux)
        run: nix-build examples -A hello-all-windows -L -o result-windows

      - name: Stage artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts/windows
          for d in result-windows/*; do
            [ -e "$d" ] || continue
            cp -L -r --no-preserve=mode,ownership "$d"/. artifacts/windows/ 2>/dev/null || true
          done
          chmod -R u+w artifacts/windows
          ls -lR artifacts/windows

      - name: Upload windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          path: artifacts/windows/**
          if-no-files-found: error
          retention-days: 14

  bundles-darwin:
    name: Build + upload darwin bundles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache /nix/store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build darwin bundles (cross-staged from linux)
        run: nix-build examples -A hello-all-darwin -L -o result-darwin

      - name: Stage artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts/darwin
          for d in result-darwin/*; do
            [ -e "$d" ] || continue
            cp -L -r --no-preserve=mode,ownership "$d"/. artifacts/darwin/ 2>/dev/null || true
          done
          chmod -R u+w artifacts/darwin
          ls -lR artifacts/darwin

      - name: Upload darwin bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-darwin
          path: artifacts/darwin/**
          if-no-files-found: error
          retention-days: 14
