name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check + lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache /nix/store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nixfmt --check
        run: |
          # Fail if any tracked .nix file is unformatted.
          mapfile -t files < <(git ls-files '*.nix')
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          nix run nixpkgs#nixfmt-rfc-style -- --check "${files[@]}"

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail .

      - name: nix flake check
        run: nix flake check -L --keep-going

  smoke:
    name: Smoke-build representative bundles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache /nix/store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build all-linux + all-windows + all-darwin
        run: |
          set -euxo pipefail
          nix build .#hello-all-linux   -L
          nix build .#hello-all-windows -L
          nix build .#hello-all-darwin  -L
          nix build .#docs              -L

      - name: List artifacts
        run: |
          for d in result*; do
            [ -e "$d" ] || continue
            echo "== $d =="
            ls -R "$d"
          done
