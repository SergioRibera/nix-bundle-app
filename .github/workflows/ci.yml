name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check + lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nixfmt --check
        run: |
          mapfile -t files < <(git ls-files '*.nix')
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          nix run nixpkgs#nixfmt-rfc-style -- --check "${files[@]}"

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail .

      - name: nix flake check (evaluation gate)
        run: nix flake check --no-build -L

  tests:
    name: check · ${{ matrix.system }} · ${{ matrix.check }}
    needs: check
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux checks (x86_64-linux)
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-deb }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-rpm }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-archlinux }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-appimage }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-tar-gz }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-zip }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-app }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-brew }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-brew-linux }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-pkg }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-productbuild }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-nsis }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-msi }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-service-deb }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-service-nsis }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-service-pkg }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-extra-files-deb }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-extra-files-rpm }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: bundle-extra-files-archlinux }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-deb }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-rpm }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-archlinux }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-appimage }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-flatpak }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-snap }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-tar-gz }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-zip }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-app }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-brew }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-pkg }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-productbuild }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-nsis }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-msi }
          - { runs-on: ubuntu-latest, system: x86_64-linux, check: rust-windows-zip }
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build check ${{ matrix.check }}
        run: nix build ".#checks.${{ matrix.system }}.${{ matrix.check }}" -L --keep-going --no-link

  bundle:
    name: ${{ matrix.group }} · ${{ matrix.attr }}
    needs: check
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- linux (native) ------------------------------------------------
          - { group: linux,          attr: hello-deb,           runs-on: ubuntu-latest }
          - { group: linux,          attr: hello-rpm,           runs-on: ubuntu-latest }
          - { group: linux,          attr: hello-archlinux,     runs-on: ubuntu-latest }
          - { group: linux,          attr: hello-appimage,      runs-on: ubuntu-latest }
          - { group: linux,          attr: hello-flatpak,       runs-on: ubuntu-latest }
          - { group: linux,          attr: hello-snap,          runs-on: ubuntu-latest }
          - { group: linux,          attr: hello-tar-gz,        runs-on: ubuntu-latest }
          - { group: linux,          attr: hello-tar-xz,        runs-on: ubuntu-latest }
          - { group: linux,          attr: hello-zip,           runs-on: ubuntu-latest }
          # ---- windows (cross from linux) -----------------------------------
          - { group: windows,        attr: hello-nsis,          runs-on: ubuntu-latest }
          - { group: windows,        attr: hello-msi,           runs-on: ubuntu-latest }
          - { group: windows,        attr: hello-windows-zip,   runs-on: ubuntu-latest }
          # ---- darwin (cross from linux) ------------------------------------
          - { group: darwin-cross,   attr: hello-app,           runs-on: ubuntu-latest }
          - { group: darwin-cross,   attr: hello-brew,          runs-on: ubuntu-latest }
          - { group: darwin-cross,   attr: hello-dmg,           runs-on: ubuntu-latest }
          - { group: darwin-cross,   attr: hello-pkg,           runs-on: ubuntu-latest }
          - { group: darwin-cross,   attr: hello-productbuild,  runs-on: ubuntu-latest }
          # ---- darwin (native macos runner) ---------------------------------
          - { group: darwin-native,  attr: hello-app,           runs-on: macos-latest }
          - { group: darwin-native,  attr: hello-brew,          runs-on: macos-latest }
          - { group: darwin-native,  attr: hello-dmg,           runs-on: macos-latest }
          - { group: darwin-native,  attr: hello-pkg,           runs-on: macos-latest }
          - { group: darwin-native,  attr: hello-productbuild,  runs-on: macos-latest }
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build ${{ matrix.attr }}
        run: nix build ".#${{ matrix.attr }}" -L --keep-going -o result

      - name: Stage artifacts
        run: |
          set -euxo pipefail
          out="artifacts/${{ matrix.group }}/${{ matrix.attr }}"
          mkdir -p "$out"
          # Dereference every symlink under result/ (bundle output = store dir
          # of files; bundleAll output = linkFarm of per-format symlinks).
          # BSD cp (macOS) lacks GNU long options — use short flags only and
          # fix up read-only /nix/store perms with chmod afterwards.
          cp -RL result/. "$out/"
          chmod -R u+w "$out"
          ls -lR "$out"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.group }}-${{ matrix.attr }}
          path: artifacts/${{ matrix.group }}/${{ matrix.attr }}/**
          if-no-files-found: error
          retention-days: 14

  # Install + run each generated bundle on a clean runner that has NO Nix.
  # Verifies the artifact ships everything the target OS needs (runtime libs,
  # loader, desktop scaffolding, installer scripts).
  smoke:
    name: smoke · ${{ matrix.name }}
    needs: bundle
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- linux, host runner (no container) ----
          - name: deb
            runs-on: ubuntu-latest
            artifact: bundle-linux-hello-deb
            shell: bash
            run: |
              set -eux
              sudo apt-get update -qq
              sudo dpkg -i ./pkg/*.deb || sudo apt-get -f install -y
              hello | grep -q "Hello, world!"
          - name: appimage
            runs-on: ubuntu-latest
            artifact: bundle-linux-hello-appimage
            shell: bash
            run: |
              set -eux
              img=$(ls ./pkg/*.AppImage | head -1)
              chmod +x "$img"
              "$img" --appimage-extract >/dev/null
              ./squashfs-root/AppRun | grep -q "Hello, world!"
          - name: tar-gz
            runs-on: ubuntu-latest
            artifact: bundle-linux-hello-tar-gz
            shell: bash
            run: |
              set -eux
              mkdir extract
              tar -xzf ./pkg/*.tar.gz -C extract
              bin=$(find extract -type f -name hello -perm -u+x | head -1)
              "$bin" | grep -q "Hello, world!"
          - name: tar-xz
            runs-on: ubuntu-latest
            artifact: bundle-linux-hello-tar-xz
            shell: bash
            run: |
              set -eux
              mkdir extract
              tar -xJf ./pkg/*.tar.xz -C extract
              bin=$(find extract -type f -name hello -perm -u+x | head -1)
              "$bin" | grep -q "Hello, world!"
          - name: zip-linux
            runs-on: ubuntu-latest
            artifact: bundle-linux-hello-zip
            shell: bash
            run: |
              set -eux
              sudo apt-get install -y -qq unzip
              mkdir extract
              unzip -q ./pkg/*.zip -d extract
              bin=$(find extract -type f -name hello -perm -u+x | head -1)
              "$bin" | grep -q "Hello, world!"
          # ---- linux, container (native pkg manager) ----
          - name: rpm
            runs-on: ubuntu-latest
            container: fedora:latest
            artifact: bundle-linux-hello-rpm
            shell: bash
            run: |
              set -eux
              dnf install -y ./pkg/*.rpm
              hello | grep -q "Hello, world!"
          - name: archlinux
            runs-on: ubuntu-latest
            container: archlinux:latest
            artifact: bundle-linux-hello-archlinux
            shell: bash
            run: |
              set -eux
              pacman -Sy --noconfirm
              pkg=$(find ./pkg -maxdepth 1 -name '*.pkg.tar.zst' | head -1)
              pacman -U --noconfirm "$pkg"
              hello | grep -q "Hello, world!"
          # ---- windows ----
          - name: nsis
            runs-on: windows-latest
            artifact: bundle-windows-hello-nsis
            shell: pwsh
            run: |
              $inst = Get-ChildItem pkg -Filter *.exe | Select-Object -First 1
              Start-Process -FilePath $inst.FullName -ArgumentList "/S" -Wait
              $bin = Get-ChildItem "C:\Program Files","C:\Program Files (x86)","$env:LOCALAPPDATA" -Recurse -Filter hello.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $bin) { throw "hello.exe not found after NSIS install" }
              & $bin.FullName | Select-String -Quiet "Hello, world!"
          - name: msi
            runs-on: windows-latest
            artifact: bundle-windows-hello-msi
            shell: pwsh
            run: |
              $msi = Get-ChildItem pkg -Filter *.msi | Select-Object -First 1
              Start-Process msiexec.exe -ArgumentList "/i","`"$($msi.FullName)`"","/quiet","/norestart" -Wait
              $bin = Get-ChildItem "C:\Program Files","C:\Program Files (x86)","$env:LOCALAPPDATA" -Recurse -Filter hello.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $bin) { throw "hello.exe not found after MSI install" }
              & $bin.FullName | Select-String -Quiet "Hello, world!"
          - name: zip-windows
            runs-on: windows-latest
            artifact: bundle-windows-hello-windows-zip
            shell: pwsh
            run: |
              $zip = Get-ChildItem pkg -Filter *.zip | Select-Object -First 1
              Expand-Archive -Path $zip.FullName -DestinationPath extract
              $bin = Get-ChildItem extract -Recurse -Filter hello.exe | Select-Object -First 1
              if (-not $bin) { throw "hello.exe not found in zip" }
              & $bin.FullName | Select-String -Quiet "Hello, world!"
          # ---- darwin (native artifacts built on macos-latest) ----
          - name: app
            runs-on: macos-latest
            artifact: bundle-darwin-native-hello-app
            shell: bash
            run: |
              set -eux
              app=$(find ./pkg -maxdepth 3 -name '*.app' -type d | head -1)
              "$app/Contents/MacOS/hello" | grep -q "Hello, world!"
          - name: dmg
            runs-on: macos-latest
            artifact: bundle-darwin-native-hello-dmg
            shell: bash
            run: |
              set -eux
              dmg=$(ls ./pkg/*.dmg | head -1)
              mp=$(mktemp -d)
              hdiutil attach "$dmg" -mountpoint "$mp" -nobrowse -quiet
              app=$(find "$mp" -maxdepth 3 -name '*.app' -type d | head -1)
              "$app/Contents/MacOS/hello" | grep -q "Hello, world!"
              hdiutil detach "$mp" -quiet
          - name: pkg
            runs-on: macos-latest
            artifact: bundle-darwin-native-hello-pkg
            shell: bash
            run: |
              set -eux
              pkg=$(ls ./pkg/*.pkg | head -1)
              sudo installer -pkg "$pkg" -target /
              bin=$(command -v hello || find /Applications /usr/local /opt -name hello -perm -u+x 2>/dev/null | head -1)
              [ -n "$bin" ] || { echo "hello not found after pkg install"; exit 1; }
              "$bin" | grep -q "Hello, world!"
          - name: productbuild
            runs-on: macos-latest
            artifact: bundle-darwin-native-hello-productbuild
            shell: bash
            run: |
              set -eux
              pkg=$(ls ./pkg/*.pkg | head -1)
              sudo installer -pkg "$pkg" -target /
              bin=$(command -v hello || find /Applications /usr/local /opt -name hello -perm -u+x 2>/dev/null | head -1)
              [ -n "$bin" ] || { echo "hello not found after productbuild install"; exit 1; }
              "$bin" | grep -q "Hello, world!"
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: pkg

      - name: List downloaded contents
        shell: bash
        run: ls -laR pkg

      - name: Install + run
        shell: ${{ matrix.shell }}
        run: ${{ matrix.run }}
