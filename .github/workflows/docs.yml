name: Regenerate options docs

# Build `packages.docs` whenever the schema (or anything it imports) changes
# and commit the regenerated `docs/options.{md,json}` back to the branch.
on:
  push:
    branches:
      - main
    paths:
      - 'lib/schema.nix'
      - 'lib/info.nix'
      - 'lib/docs.nix'
      - 'overlay.nix'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT or the default token; default GITHUB_TOKEN can push to
          # the same repo so long as the workflow has `contents: write`.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build docs derivation
        run: nix-build lib/docs.nix -L -o result

      - name: Sync into docs/
        run: |
          set -euo pipefail
          mkdir -p docs
          cp -L result/share/doc/nix-bundle-app/options.md   docs/options.md
          cp -L result/share/doc/nix-bundle-app/options.json docs/options.json
          cp -L result/share/doc/nix-bundle-app/targets.md   docs/targets.md
          chmod 644 docs/options.md docs/options.json docs/targets.md

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/options.md docs/options.json docs/targets.md

          if git diff --staged --quiet; then
            echo "Schema produced no doc changes; nothing to commit."
            exit 0
          fi

          git commit -m "docs: regenerate options reference

          Autogenerated by .github/workflows/docs.yml from lib/schema.nix.
          [skip ci]"
          git push
